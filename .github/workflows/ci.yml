name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 定期実行はしない（次の改訂まで直さないため。2026-11-23）。
  # 改訂を始めるときや、読者から動かないと連絡があったときは、Actions の画面から手で実行する
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 本に載せるファイルの行幅（69 桁まで）
        run: python3 tests/check-width.py
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck "${files[@]}"
      - name: shfmt
        shell: bash
        run: |
          set -euo pipefail
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          mapfile -t files < <(git ls-files '*.sh')
          "$(go env GOPATH)/bin/shfmt" -d "${files[@]}"
      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint .github/workflows/*.yml

  env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 学習環境を作って中で確かめる
        shell: bash
        run: bash tests/run.sh
